/* =====================================================
   CREATE A LABEL TEXTURE
===================================================== */

function createLocationLabel(
    city,
    country
) {

    const canvas =
        document.createElement("canvas");

    canvas.width = 700;
    canvas.height = 150;

    const ctx =
        canvas.getContext("2d");

    /*
       Dark translucent background
       like a real tracking map.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.78)";

    ctx.beginPath();

    ctx.roundRect(
        5,
        5,
        690,
        140,
        18
    );

    ctx.fill();

    /*
       City name
    */

    ctx.font =
        "bold 42px Arial";

    ctx.fillStyle =
        "white";

    ctx.textAlign =
        "center";

    ctx.fillText(
        city,
        350,
        58
    );

    /*
       Country name
    */

    ctx.font =
        "24px Arial";

    ctx.fillStyle =
        "#9fb1c3";

    ctx.fillText(
        country,
        350,
        103
    );

    /*
       Small red tracking dot
    */

    ctx.beginPath();

    ctx.arc(
        350,
        128,
        6,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ff3030";

    ctx.fill();

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.needsUpdate =
        true;

    return texture;
}


/* =====================================================
   CREATE ALL GLOBE LABELS
===================================================== */

const locationLabelGroup =
    new THREE.Group();

scene.add(
    locationLabelGroup
);


locationLabels.forEach(function(place) {

    const texture =
        createLocationLabel(
            place.name,
            place.country
        );


    const material =
        new THREE.SpriteMaterial({

            map: texture,

            transparent: true,

            depthTest: false,

            depthWrite: false

        });


    const sprite =
        new THREE.Sprite(
            material
        );


    /*
       Put the label at the EXACT
       latitude/longitude of the city.
    */

    const position =
        latLngToVector3(
            place.lat,
            place.lng,
            EARTH_RADIUS + .075
        );


    sprite.position.copy(
        position
    );


    /*
       Keep labels readable.
    */

    sprite.scale.set(
        .65,
        .14,
        1
    );


    sprite.renderOrder =
        20;


    locationLabelGroup.add(
        sprite
    );

});
